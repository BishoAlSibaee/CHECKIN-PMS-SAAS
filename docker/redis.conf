# Hotel System — Redis tuned as a cache + queue backend (Docker / VPS).
# Queue jobs live on DB 0; Laravel cache store uses DB 1 (see REDIS_CACHE_DB).
#
# Official guidance: https://redis.io/docs/latest/develop/reference/eviction/

maxmemory 256mb
maxmemory-policy allkeys-lru

# Keep AOF/RDB defaults off for pure cache/queue workloads in local Docker.
# Production may enable persistence separately if durable queues are required.
save ""
appendonly no
