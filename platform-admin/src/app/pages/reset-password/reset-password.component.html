<div class="login-screen">
  @if (linkInvalid()) {
    <div class="card login-card">
      <h1>رابط غير صالح</h1>
      <p class="subtitle">هذا الرابط غير مكتمل. اطلب رابطًا جديدًا من صفحة "نسيت كلمة المرور".</p>
      <a routerLink="/forgot-password" class="btn btn-primary login-btn">طلب رابط جديد</a>
    </div>
  } @else if (done()) {
    <div class="card login-card">
      <h1>تم بنجاح</h1>
      <p class="subtitle">تم تغيير كلمة المرور. سننقلك لتسجيل الدخول الآن...</p>
    </div>
  } @else {
    <form class="card login-card" (ngSubmit)="submit()">
      <h1>إعادة تعيين كلمة المرور</h1>
      <p class="subtitle">{{ email }}</p>

      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <div class="field">
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" minlength="8" required />
      </div>

      <div class="field">
        <label for="passwordConfirmation">تأكيد كلمة المرور</label>
        <input id="passwordConfirmation" type="password" name="passwordConfirmation" [(ngModel)]="passwordConfirmation" autocomplete="new-password" minlength="8" required />
      </div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading()">
        {{ loading() ? 'جارٍ الحفظ...' : 'تغيير كلمة المرور' }}
      </button>
    </form>
  }
</div>
