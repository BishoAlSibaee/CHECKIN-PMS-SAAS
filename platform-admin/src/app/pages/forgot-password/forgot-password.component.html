<div class="login-screen">
  @if (sent()) {
    <div class="card login-card">
      <h1>تحقق من بريدك</h1>
      <p class="subtitle">إذا كان هذا البريد مسجّلاً لدينا، فقد أرسلنا رابط إعادة تعيين كلمة المرور إليه.</p>
      <a routerLink="/login" class="btn btn-primary login-btn">رجوع لتسجيل الدخول</a>
    </div>
  } @else {
    <form class="card login-card" (ngSubmit)="submit()">
      <h1>نسيت كلمة المرور؟</h1>
      <p class="subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين.</p>

      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" required />
      </div>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading()">
        {{ loading() ? 'جارٍ الإرسال...' : 'إرسال رابط إعادة التعيين' }}
      </button>

      <a routerLink="/login" class="forgot-link">رجوع لتسجيل الدخول</a>
    </form>
  }
</div>
